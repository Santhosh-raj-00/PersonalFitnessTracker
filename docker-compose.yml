version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fittrack_postgres
    restart: always
    environment:
      POSTGRES_DB: fittrackdb
      POSTGRES_USER: fittrack
      POSTGRES_PASSWORD: fittrack_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fittrack -d fittrackdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fittrack_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fittrackdb
      SPRING_DATASOURCE_USERNAME: fittrack
      SPRING_DATASOURCE_PASSWORD: fittrack_password
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_JPA_DIALECT: org.hibernate.dialect.PostgreSQLDialect
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
