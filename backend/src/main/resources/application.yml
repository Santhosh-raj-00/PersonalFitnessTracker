server:
  port: 8085

spring:
  application:
    name: fittrack-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:fittrackdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: FitTrackSecretKeySuperSecureLongEnoughForHMACSHA256Signature123456
    expiration-ms: 86400000
  media:
    exercise-raw-base-url: "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/"
    exercise-cdn-base-url: "https://cdn.jsdelivr.net/gh/yuhonas/free-exercise-db@main/exercises/"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
